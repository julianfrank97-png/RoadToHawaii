<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111d">
  <meta name="description" content="Triathlon Karriere – Complete Career: Mobile-First Triathlon-Rollenspiel mit Trainingsplanung, Zielrennen, 18 Skills, Weltkarte, Werkstatt und Road to Hawaii.">
  <title>Triathlon Karriere – Complete Career</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <noscript>Dieses Spiel benötigt JavaScript.</noscript>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" data-route="home" aria-label="Zur Übersicht">
        <span class="brand-mark">▲</span>
        <span><strong>Triathlon Karriere</strong><small id="careerLabel">Lokaler Amateur</small></span>
      </button>
      <button id="settingsButton" class="icon-button" aria-label="Einstellungen">⚙</button>
    </header>
    <section class="resource-strip" aria-label="Ressourcen">
      <div><span>💶</span><strong id="moneyValue">0 €</strong></div>
      <div><span>⭐</span><strong id="reputationValue">0</strong></div>
      <div><span>👥</span><strong id="fansValue">0</strong></div>
      <div><span>🏆</span><strong id="winsValue">0</strong></div>
    </section>
    <main id="mainContent" class="main-content" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <button class="nav-item active" data-route="home"><span>⌂</span><small>Home</small></button>
      <button class="nav-item" data-route="training"><span>◉</span><small>Training</small></button>
      <button class="nav-item" data-route="races"><span>⚑</span><small>Rennen</small></button>
      <button class="nav-item" data-route="world"><span>🧭</span><small>Welt</small></button>
      <button class="nav-item" data-route="gear"><span>⬡</span><small>Gear</small></button>
      <button class="nav-item" data-route="more"><span>•••</span><small>Mehr</small></button>
    </nav>
  </div>
  <dialog id="gameDialog" class="game-dialog">
    <form method="dialog" class="dialog-shell">
      <div class="dialog-header"><h2 id="dialogTitle">Details</h2><button class="icon-button" value="cancel" aria-label="Schließen">×</button></div>
      <div id="dialogContent" class="dialog-content"></div>
    </form>
  </dialog>
  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="js/game-data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
