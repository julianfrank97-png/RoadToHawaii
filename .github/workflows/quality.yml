name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Daten, Dateien und Kernabläufe testen
        run: npm test
